<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XAU/USD Gold Data Dashboard</title>
    <meta http-equiv="refresh" content="120" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --accent: #22c55e;
        --accent-2: #38bdf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #0b1120 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 16px 48px;
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 42px);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.14);
        color: var(--accent);
        border: 1px solid rgba(34, 197, 94, 0.4);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin: 24px 0 28px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        margin-top: 10px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.up {
        background: rgba(34, 197, 94, 0.14);
        color: #86efac;
      }

      .badge.down {
        background: rgba(239, 68, 68, 0.14);
        color: #fca5a5;
      }

      .card {
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        font-size: clamp(22px, 2vw, 32px);
        font-weight: 700;
        margin-top: 10px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(148, 163, 184, 0.08);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        font-weight: 700;
      }

      .status {
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 14px;
      }

      th {
        background: rgba(148, 163, 184, 0.06);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 12px;
      }

      tbody tr:hover {
        background: rgba(56, 189, 248, 0.06);
      }

      .muted {
        color: var(--muted);
      }

      .refresh-note {
        margin-top: 16px;
        text-align: right;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 640px) {
        .container { padding: 0 12px 32px; }
        th, td { font-size: 12px; padding: 8px 10px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title-wrap">
          <h1>XAU/USD Gold OHLCV Dashboard</h1>
        </div>
        <div class="pill">Live Auto Refresh</div>
      </div>

      <div class="stats">
        <div class="card">
          <div class="label">Last Price</div>
          <div class="value" id="last-price">--</div>
          <div class="badge" id="change-badge">--</div>
        </div>
        <div class="card">
          <div class="label">High</div>
          <div class="value" id="high-price">--</div>
        </div>
        <div class="card">
          <div class="label">Low</div>
          <div class="value" id="low-price">--</div>
        </div>
        <div class="card">
          <div class="label">Volume</div>
          <div class="value" id="total-volume">--</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>GC=F • 5m Data</span>
          <span class="status" id="status">Loading...</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Datetime</th>
              <th>Open</th>
              <th>High</th>
              <th>Low</th>
              <th>Close</th>
              <th>Volume</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="refresh-note">Auto-refreshes every 120 seconds.</div>
    </div>

    <script>
      const CSV_URL = 'https://raw.githubusercontent.com/shikerkattiyar11-debug/xauusd-gold-data/master/data/xauusd_5m.csv';
      const tableBody = document.getElementById('table-body');
      const statusEl = document.getElementById('status');
      const lastPriceEl = document.getElementById('last-price');
      const highPriceEl = document.getElementById('high-price');
      const lowPriceEl = document.getElementById('low-price');
      const totalVolumeEl = document.getElementById('total-volume');
      const changeBadgeEl = document.getElementById('change-badge');

      function formatNumber(value) {
        return Number(value).toLocaleString(undefined, { maximumFractionDigits: 4 });
      }

      function getStatusText(lastTimestamp) {
        if (!lastTimestamp) return 'Unknown';
        const lastDate = new Date(lastTimestamp);
        const now = new Date();
        const minutesDiff = (now - lastDate) / 60000;
        return minutesDiff <= 15 ? 'LIVE' : 'STALE';
      }

      async function loadData() {
        try {
          statusEl.textContent = 'Loading...';
          const response = await fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('CSV fetch failed');
          }

          const csvText = await response.text();
          const rows = csvText.trim().split('\n').slice(1);
          const parsed = rows.map((row) => {
            const [Datetime, Open, High, Low, Close, Volume] = row.split(',');
            return { Datetime, Open, High, Low, Close, Volume };
          }).filter((row) => row.Datetime);

          if (parsed.length === 0) {
            throw new Error('No data rows');
          }

          const last = parsed[parsed.length - 1];
          const previous = parsed[parsed.length - 2] || last;
          const priceChange = Number(last.Close) - Number(previous.Close);
          const priceChangePct = previous.Close ? (priceChange / Number(previous.Close)) * 100 : 0;
          const highs = parsed.map((row) => Number(row.High));
          const lows = parsed.map((row) => Number(row.Low));
          const totalVolume = parsed.reduce((sum, row) => sum + Number(row.Volume || 0), 0);

          lastPriceEl.textContent = formatNumber(last.Close);
          highPriceEl.textContent = formatNumber(Math.max(...highs));
          lowPriceEl.textContent = formatNumber(Math.min(...lows));
          totalVolumeEl.textContent = formatNumber(totalVolume);

          const changeText = `${priceChange >= 0 ? '+' : ''}${formatNumber(priceChange)} (${priceChange >= 0 ? '+' : ''}${priceChangePct.toFixed(2)}%)`;
          changeBadgeEl.textContent = changeText;
          changeBadgeEl.className = `badge ${priceChange >= 0 ? 'up' : 'down'}`;

          const lastTimestamp = new Date(last.Datetime.replace(' ', 'T'));
          statusEl.textContent = getStatusText(lastTimestamp);
          statusEl.style.color = getStatusText(lastTimestamp) === 'LIVE' ? '#86efac' : '#fca5a5';

          const newestRows = parsed.slice(-12).reverse();
          tableBody.innerHTML = newestRows.map((row) => `
            <tr>
              <td>${row.Datetime}</td>
              <td>${formatNumber(row.Open)}</td>
              <td>${formatNumber(row.High)}</td>
              <td>${formatNumber(row.Low)}</td>
              <td>${formatNumber(row.Close)}</td>
              <td>${formatNumber(row.Volume)}</td>
            </tr>
          `).join('');

          statusEl.textContent = 'Live';
        } catch (error) {
          console.error(error);
          statusEl.textContent = 'Error';
        }
      }

      loadData();
      setInterval(loadData, 120000);
    </script>
  </body>
</html>
